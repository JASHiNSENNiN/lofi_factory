key: lofi_drill
family: drill_trap
composition:
  piano_program: GM_RHODES
  melody_program: GM_ORGAN_ROCK
  countermelody_program: GM_CELLO
  scales: [natural_minor, harmonic_minor, phryg, pent]
  drum_pattern_indices: [15, 11, 2, 9]
  bpm_range: [72, 88]
  energy: high
  progression_indices: [14, 15, 41, 42, 43, 7, 39]
swing_range: [0.63, 0.74]
cozy_bias: false
# research/subgenres/lofi_drill.md: "the sliding/gliding 808 bass...the
# single most recognizable production element in modern drill" -- 808
# pitch-slide/portamento on the root hit's tail (build_bass(..., glide=True)).
bass_style: glide_808
# research/theory/rhythm-groove.md: drill hi-hats are triplet subdivisions
# layered over the underlying 16th grid, a genuinely different subdivision
# from a denser 16-step pattern -- see build_drums(chh_triplet=True).
chh_triplet: true
texture: {program: GM_ORGAN_ROCK, style: stab}
drum_sampler_pattern: 808_trap
mix: {lpf_hz: 7200, bitcrush_bits: 8, reverb_room: 0.35, reverb_wet: 0.2, tape_wobble_depth: 0.28,
  compress_ratio: 4.2, vinyl_crackle: 0.2, use_ir_reverb: true, sidechain_duck: true,
  duck_profile: hiphop, presence_db: -1.5, warmth_db: 1.5}
# research/theory/arrangement-structure.md #6: lofi_drill is buildup/release-
# driven, not wallpaper music, and was silently falling back to 'standard'.
song_form: build
